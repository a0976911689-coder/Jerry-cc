<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>九月初一 拜拜水果</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--wine:#6B1F2A;--cream:#FAF5EC;--gold:#C9A96E}
*{box-sizing:border-box;margin:0}
body{background:#222;font-family:'Noto Serif TC',serif;font-weight:700;display:flex;flex-wrap:wrap;gap:24px;padding:24px}
.slide{flex:none;width:1080px;height:1350px;position:relative;overflow:hidden;padding:150px 100px 110px 90px;display:flex;flex-direction:column;color:var(--cream);background-size:cover;background-position:center}
.label{font-size:44px;color:var(--gold);letter-spacing:.12em}
.bar{width:64px;height:5px;background:var(--gold);margin:26px 0 54px}
h2{font-size:104px;line-height:1.3;font-weight:900;color:#fff}
h2 em{font-style:normal;color:var(--gold)}
.sub{font-size:46px;color:rgba(250,245,236,.7);margin-top:30px}
.box{margin-top:56px;border-left:7px solid var(--gold);background:rgba(250,245,236,.14);padding:44px 52px;font-size:48px;line-height:1.9}
.box b{color:var(--gold)}
.foot{margin-top:auto;display:flex;justify-content:space-between;font-size:34px;color:rgba(250,245,236,.6)}
.swipe{align-self:flex-start;margin-top:52px;border:3px solid var(--gold);color:var(--gold);padding:14px 40px;font-size:42px;border-radius:60px}
</style></head><body>
<script>
// ===== 改這裡（價格請換成當天實際價格） =====
const GROUP = '阿英的聊天群';
const CUTOFF = '10/9（五）12:00 前下單';
const ITEMS = ['紐西蘭蘋果　3 顆 100 元','次郎甜柿　1 顆 50 元','東山椪柑　80 元／斤','火龍果　60 元／斤','美國蜜世界　1 顆 400 元'];
// ==========================================
const OV='linear-gradient(rgba(28,8,12,.76),rgba(28,8,12,.82))';
const bg=u=>`background-image:${OV},url(${u})`;
const foot=`<div class="foot"><span>英仔果子行 ・ 梓官</span><span>@a_yin_fruit</span></div>`;
document.body.insertAdjacentHTML('beforeend', [
`<div class="slide" style="${bg('photos/persimmon.jpg')}"><div class="label">10/10（六）九月初一</div><div class="bar"></div>
 <h2>初一拜拜的水果<br><em>你備好了嗎？</em></h2><div class="sub">中午前預訂，當天送或來店自取</div><div class="swipe">往右滑看清單 →</div>${foot}</div>`,
`<div class="slide" style="${bg('photos/apple-new.jpg')}"><div class="label">日期幫你記好</div><div class="bar"></div>
 <h2>這三天<br><em>記得備水果</em></h2>
 <div class="box"><b>10/9（五）</b>　農曆八月廿九<br><b>10/10（六）</b>　九月初一<br><b>10/11（日）</b>　九月初二</div>${foot}</div>`,
`<div class="slide" style="${bg('photos/pomelo.jpg')}"><div class="label">小英的提醒</div><div class="bar"></div>
 <h2>拜拜水果<br><em>這樣挑</em></h2>
 <div class="box">① 新鮮完整、沒有碰傷<br>② 洗淨擦乾再擺上<br>③ 各宮廟習俗不同，<br>　 不確定先問廟方</div>${foot}</div>`,
`<div class="slide" style="${bg('photos/dragonfruit.jpg')}"><div class="label">這次可預訂</div><div class="bar"></div>
 <h2>拜拜水果<br><em>一次備齊</em></h2>
 <div class="box">${ITEMS.join('<br>')}</div>${foot}</div>`,
`<div class="slide" style="${bg('photos/ponkan-new.jpg')}"><div class="label">怎麼預訂</div><div class="bar"></div>
 <h2>傳「品名＋數量」<br><em>我們幫你留</em></h2><div class="sub">梓官區通安路215號 ・ 06:00–12:00</div>
 <div class="box" style="display:flex;gap:36px;align-items:center;font-size:40px;line-height:1.8;padding:40px 44px"><div>${CUTOFF}<br>當天送或來店自取<br>現金付款<br><b>掃 QR 加入聊天群</b></div><img src="assets/line-openchat-qr.jpg" style="width:230px;height:230px;border:6px solid #fff;border-radius:10px;flex:none"></div>${foot}</div>`
].join(''));
</script></body></html>
