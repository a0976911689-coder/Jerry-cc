<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<title>英仔水果 LINE 今日推薦</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--wine:#6B1F2A;--cream:#FAF5EC;--gold:#C9A96E;--ink:#2B2B2B}
*{box-sizing:border-box;margin:0}
body{background:#999;font-family:'Noto Serif TC',serif;font-weight:700;display:flex;gap:24px;padding:24px;align-items:flex-start}
.serif{font-family:'Noto Serif TC','WenQuanYi Zen Hei',serif}
/* 封面 1040x1040 */
#cover{flex:none;width:1040px;height:1040px;background:var(--wine);color:var(--cream);padding:70px 60px;display:flex;flex-direction:column;position:relative}
#cover .frame{position:absolute;inset:24px;border:2px solid var(--gold);pointer-events:none}
.kicker{color:var(--gold);font-size:38px;letter-spacing:.2em}
#cover h1{font-size:128px;line-height:1.2;font-weight:900;margin-top:26px}
#cover h1 em{font-style:normal;color:var(--gold)}
.date{font-size:44px;color:rgba(250,245,236,.7);margin-top:20px;letter-spacing:.08em}
.strip{display:flex;gap:16px;margin-top:auto}
.strip div{flex:1;text-align:center;font-size:32px;color:var(--cream)}
.strip i{display:block;aspect-ratio:1;background-size:cover;background-position:center;border:2px solid var(--gold);margin-bottom:12px}
.brand{margin-top:34px;color:var(--gold);font-size:34px;letter-spacing:.14em;text-align:center}
/* 長圖 */
#list{flex:none;width:1080px;background:var(--cream);color:var(--ink)}
.head{background:var(--wine);color:var(--cream);padding:80px 70px 64px;position:relative}
.head h2{font-size:92px;font-weight:900;line-height:1.25}
.head h2 em{font-style:normal;color:var(--gold)}
.head p{margin-top:16px;font-size:38px;color:rgba(250,245,236,.75);letter-spacing:.06em}
.head .bar{width:90px;height:5px;background:var(--gold);margin-top:34px}
.card{display:flex;gap:44px;padding:56px 70px;border-bottom:2px solid rgba(201,169,110,.5)}
.card .ph{flex:0 0 380px;height:380px;background-size:cover;background-position:center;border:3px solid var(--gold)}
.card .tx{flex:1;display:flex;flex-direction:column;justify-content:center}
.tag{align-self:flex-start;background:var(--wine);color:var(--cream);font-size:32px;padding:6px 24px;letter-spacing:.08em}
.card h3{font-size:56px;font-weight:900;margin:22px 0 14px;line-height:1.2;color:var(--wine)}
.card p{font-size:36px;line-height:1.65;color:#4a4a4a}
.price{margin-top:12px;font-size:52px;font-weight:700;color:var(--wine)}
.cta{background:var(--wine);color:var(--cream);padding:70px;text-align:center}
.cta h4{font-size:64px;font-weight:900;color:var(--gold);line-height:1.3}
.cta p{font-size:40px;line-height:1.8;margin-top:22px}
.cta small{display:block;margin-top:30px;font-size:32px;color:rgba(250,245,236,.65)}
</style></head><body>
<script>
// ===== 每天只需改這裡 =====
const DATE = (() => { const t = new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Taipei' })); return `${t.getMonth() + 1}／${t.getDate()}`; })();
const ITEMS = [
 {file:'apple', name:'紐西蘭蘋果', origin:'紐西蘭進口', desc:'今日推薦新品。', price:'3 顆 100 元', img:'photos/apple-new.jpg'},
 {file:'honeydew', name:'美國蜜世界', origin:'美國空運', desc:'今日推薦新品。', price:'1 顆 400 元', img:'photos/melon-new.jpg'},
 {file:'passion', name:'藍星百香果', origin:'今日新品', desc:'這超香，吃起來超甜！', price:'5 粒 100 元', img:'photos/passion.jpg'},
 {file:'persimmon', name:'次郎甜柿', origin:'今日新品', desc:'今日推薦新品。', price:'1 顆 50 元', img:'photos/persimmon.jpg'},
 {file:'dragonfruit', name:'火龍果', origin:'今日新品', desc:'今日推薦新品，按斤計價。', price:'60 元／斤', img:'photos/dragonfruit.jpg'},
 {file:'ponkan', name:'東山椪柑', origin:'今日新品', desc:'今日推薦新品，按斤計價。', price:'80 元／斤', img:'photos/ponkan-new.jpg'}
];
// ==========================
const cover = `<div id="cover"><div class="frame"></div>
 <div class="kicker serif">英仔水果 ・ 小英水果小教室</div>
 <h1 class="serif">今日<br><em>水果推薦</em></h1>
 <div class="date">${DATE}　新鮮到貨 ${ITEMS.length} 款</div>
 <div class="strip">${ITEMS.map(i=>`<div><i style="background-image:url(${i.img})"></i>${i.name.replace('美國','').replace('San Clemente ','')}</div>`).join('')}</div>
 <div class="brand serif">北高雄配送 ・ 歡迎自取</div></div>`;
const list = `<div id="list"><div class="head"><div class="kicker serif">英仔水果</div>
 <h2 class="serif">${DATE} <em>今日推薦</em></h2><p>小英親自挑 ・ 北高雄在地配送</p><div class="bar"></div></div>
 ${ITEMS.map(i=>`<div class="card"><div class="ph" style="background-image:url(${i.img})"></div>
  <div class="tx"><span class="tag">${i.origin}</span><h3 class="serif">${i.name}</h3><p>${i.desc}</p>${i.price?`<div class="price">${i.price}</div>`:''}</div></div>`).join('')}
 <div class="cta"><h4 class="serif">想訂購？<br>直接回覆品名與數量</h4>
 <p>可配送、也可店內自取<br>現金付款</p><small>數量有限，售完為止</small></div></div>`;
document.body.insertAdjacentHTML('beforeend', cover + list);
</script></body></html>
