<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>Threads 晚上問句圖卡</title>
<link rel="stylesheet" href="fonts/wenkai/wenkai.css">
<style>
:root{--paper:#F3EEE4;--ink:#1E1E1E;--sun:#E9C46A;--slate:#5C6F7E;--accent:#D9673A}
*{box-sizing:border-box;margin:0}
body{background:#888;display:flex;gap:24px;padding:24px}
.slide{flex:none;width:1080px;height:1350px;position:relative;overflow:hidden;color:var(--ink);padding:90px;display:flex;flex-direction:column;align-items:center;text-align:center;
 font-family:'LXGW WenKai TC',serif;font-weight:700;-webkit-text-stroke:.6px currentColor;
 background:radial-gradient(circle at 18% 12%,rgba(255,255,255,.6),transparent 40%),radial-gradient(circle at 85% 85%,rgba(200,185,160,.28),transparent 45%),var(--paper)}
.tag{font-size:38px;color:var(--slate);letter-spacing:.3em;-webkit-text-stroke:0}
.sunwrap{position:relative;width:700px;height:640px;margin:40px 0 30px;display:flex;align-items:center;justify-content:center}
.sun{position:absolute;width:660px;height:660px;border-radius:50%;background:var(--sun);opacity:.55}
.photo{position:relative;width:580px;height:580px;border-radius:24px;background-size:cover;background-position:center;box-shadow:0 18px 40px rgba(60,40,20,.18)}
h2{font-size:100px;line-height:1.25}
h2 em{font-style:normal;color:var(--accent)}
.foot{margin-top:auto;width:100%;display:flex;justify-content:space-between;font-size:32px;color:var(--slate);-webkit-text-stroke:0}
</style></head><body>
<div class="slide"><div class="tag">小英仔晚上問一下</div>
 <div class="sunwrap"><div class="sun"></div><div class="photo" style="background-image:url(photos/melon-new.jpg)"></div></div>
 <h2>蜜世界買回家<br><em>你都放幾天才削？</em></h2>
 <div class="foot"><span>英仔果子行・梓官</span><span>@a_yin_fruit</span></div></div>
</body></html>
