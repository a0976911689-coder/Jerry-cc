<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><title>新風格樣張</title>
<link rel="stylesheet" href="../node_modules/@fontsource/lxgw-wenkai-tc/700.css">
<link rel="stylesheet" href="../node_modules/@fontsource/iansui/400.css">
<style>
:root{--paper:#F3EEE4;--ink:#1E1E1E;--sun:#E9C46A;--slate:#5C6F7E;--accent:#D9673A}
*{box-sizing:border-box;margin:0}
body{background:#888;display:flex;gap:24px;padding:24px}
.slide{flex:none;width:1080px;height:1350px;position:relative;overflow:hidden;color:var(--ink);padding:80px 80px 70px;display:flex;flex-direction:column;align-items:center;
 background:radial-gradient(circle at 20% 15%,rgba(255,255,255,.55),transparent 40%),radial-gradient(circle at 85% 80%,rgba(200,185,160,.25),transparent 45%),var(--paper)}
.A{font-family:'LXGW WenKai TC',serif;font-weight:700}
.B{font-family:'Iansui',serif;-webkit-text-stroke:1.6px currentColor}
.tag{font-size:40px;color:var(--slate);letter-spacing:.3em}
.sunwrap{position:relative;width:820px;height:640px;margin:36px 0 20px;display:flex;align-items:center;justify-content:center}
.sun{position:absolute;width:640px;height:640px;border-radius:50%;background:var(--sun);opacity:.55}
.photo{position:relative;width:760px;height:560px;border-radius:28px;background:url(photos/apple-new.jpg) center/cover;box-shadow:0 18px 40px rgba(60,40,20,.18)}
h2{font-size:120px;line-height:1.15;text-align:center}
.say{font-size:48px;color:var(--slate);margin-top:14px}
.price{font-size:84px;color:var(--accent);margin-top:18px}
.foot{margin-top:auto;width:100%;display:flex;justify-content:space-between;font-size:34px;color:var(--slate)}
.mark{position:absolute;top:24px;right:30px;font-size:28px;color:#999}
</style></head><body>
<div class="slide A"><span class="mark">樣張 A：霞鶩文楷 TC 粗體</span><div class="tag">今日推薦</div>
 <div class="sunwrap"><div class="sun"></div><div class="photo"></div></div>
 <h2>紐西蘭蘋果</h2><div class="say">很脆又很甜</div><div class="price">3 顆 100 元</div>
 <div class="foot"><span>英仔果子行・梓官</span><span>@a_yin_fruit</span></div></div>
<div class="slide B"><span class="mark">樣張 B：芫荽手寫體 加粗</span><div class="tag">今日推薦</div>
 <div class="sunwrap"><div class="sun"></div><div class="photo"></div></div>
 <h2>紐西蘭蘋果</h2><div class="say">很脆又很甜</div><div class="price">3 顆 100 元</div>
 <div class="foot"><span>英仔果子行・梓官</span><span>@a_yin_fruit</span></div></div>
</body></html>
