<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<title>英仔果子行 輪播範本</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{--wine:#6B1F2A;--cream:#FAF5EC;--gold:#C9A96E;--ink:#2B2B2B}
*{box-sizing:border-box;margin:0}
body{background:#222;font-family:'Noto Serif TC',serif;font-weight:700;display:flex;flex-wrap:wrap;gap:24px;padding:24px}
.slide{width:1080px;height:1350px;position:relative;overflow:hidden;padding:150px 100px 110px 90px;display:flex;flex-direction:column;color:var(--cream);background-size:cover;background-position:center}
.serif{font-family:'Noto Serif TC','WenQuanYi Zen Hei',serif}
.label{font-size:44px;font-weight:700;color:var(--gold);letter-spacing:.12em}
.bar{width:64px;height:5px;background:var(--gold);margin:26px 0 54px}
h2{font-size:100px;line-height:1.3;font-weight:900;color:#fff}
.sub{font-size:46px;color:rgba(250,245,236,.62);margin-top:30px;letter-spacing:.04em}
.box{margin-top:60px;border-left:7px solid var(--gold);background:rgba(250,245,236,.14);padding:48px 56px;font-size:50px;line-height:1.95;letter-spacing:.04em}
.box b{color:var(--gold)}
.price{margin-top:34px;font-size:56px;font-weight:700;color:var(--gold)}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;font-size:34px;color:rgba(250,245,236,.55)}
.foot .gold{color:var(--gold);font-size:44px;font-weight:700}
.center{justify-content:center}
.big{font-size:118px;line-height:1.28}
em{font-style:normal;color:var(--gold)}
.swipe{align-self:flex-start;margin-top:56px;border:3px solid var(--gold);color:var(--gold);padding:16px 40px;font-size:42px;font-weight:700;letter-spacing:.1em;border-radius:60px}
.swipe span{margin-left:12px}
.qr{width:280px;height:280px;border:3px dashed var(--gold);display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:32px;margin-top:50px}
</style></head><body>
<script>
// ===== 每週只需改這裡 =====
const HANDLE = '@a_yin_fruit';
const CFG = {
  cover: {label:'英仔果子行', title:['同樣是水果','為什麼有的','<em>超甜</em>有的<em>很酸</em>？'], sub:'答案＋這週 3 種必買，往右滑看', swipe:'滑動看答案', bg:'photos/grape.jpg'},
  fruits: [
    {label:'No.1 韓國', name:['粒粒飽滿','韓國麝香葡萄'], sub:'一顆一顆都飽滿', bg:'photos/grape.jpg',
     points:['果粒圓潤飽滿','一口一顆很過癮','適合送禮、全家分食'], price:''},
    {label:'No.2 美國', name:['巨爆甜','美國蜜世界'], sub:'整顆個頭大、清甜', bg:'photos/melon.jpg',
     points:['個頭大、分量足','清甜好入口','適合聚會、全家分享'], price:''},
    {label:'No.3 當季', name:['酸甜又多汁','砂糖橘'], sub:'小顆一口接一口', bg:'photos/mandarin.jpg',
     points:['酸甜平衡','汁多好剝','適合日常、小朋友點心'], price:''}
  ],
  tip: {label:'答案揭曉', title:['3 招挑到','超甜好水果'], bg:'photos/mandarin.jpg',
        points:['<b>葡萄</b>　看果粒飽滿、果梗翠綠','<b>蜜世界</b>　聞蒂頭有自然果香','<b>砂糖橘</b>　拿起來有沉手感']},
  cta: {label:'想預訂？', title:['點主頁連結','加 LINE 預訂'], sub:'初一、十五前請提早預訂', bg:'photos/grape.jpg'}
};
// ==========================
const OV = 'linear-gradient(rgba(28,8,12,.74),rgba(28,8,12,.80))';
const bg = u => `background-image:${OV},url(${u})`;
const foot = (l) => `<div class="foot"><span>${l||''}</span><span>${HANDLE}</span></div>`;
const S = [];
const c=CFG.cover;
S.push(`<div class="slide" style="${bg(c.bg)}"><div class="label serif">${c.label}</div><div class="bar"></div>
 <h2 class="serif big">${c.title.join('<br>')}</h2><div class="sub">${c.sub}</div>
 <div class="swipe">${c.swipe} <span>→</span></div>${foot('英仔果子行 ・ 梓官')}</div>`);
CFG.fruits.forEach(f=>S.push(`<div class="slide" style="${bg(f.bg)}"><div class="label serif">${f.label}</div><div class="bar"></div>
 <h2 class="serif">${f.name[0]}<br>${f.name[1]}</h2><div class="sub">${f.sub}</div>
 <div class="box">${f.points.join('<br>')}</div>${f.price?`<div class="price">${f.price}</div>`:''}${foot('')}</div>`));
const t=CFG.tip;
S.push(`<div class="slide" style="${bg(t.bg)}"><div class="label serif">${t.label}</div><div class="bar"></div>
 <h2 class="serif">${t.title[0]}<br>${t.title[1]}</h2>
 <div class="box">${t.points.join('<br>')}</div>${foot('')}</div>`);
const e=CFG.cta;
S.push(`<div class="slide" style="${bg(e.bg)}"><div class="label serif">${e.label}</div><div class="bar"></div>
 <h2 class="serif">${e.title[0]}<br>${e.title[1]}</h2><div class="sub">${e.sub}</div><div class="qr">放 LINE QR</div>${foot('客製禮籃請私訊洽詢')}</div>`);
document.body.insertAdjacentHTML('beforeend', S.join(''));
</script></body></html>
